# Gapla kompyuter ilovasining Mac versiyasini (OpenWhispr asosida) GitHub'ning Mac serverlarida yig'adi (G61, 2026-11-14).
# Natija: Actions sahifasida ikki fayl — «gapla-mac-arm64» (Apple M1 va keyingilari) va «gapla-mac-x64» (Intel Mac).
# Bu repo — ochiq NUSXA: asl kod yopiq Gapla-Keyboard reposida (loyihalar/loyiha-gapla-windows/kod), bu yerdagi kompyuter/
# papkasiga loyihalar/loyiha-gapla-windows/ochiq-nusxa/yangila.py qo'yadi. Ochiq repoda Mac daqiqalari bepul.
# Imzo yo'q (Apple dasturchi hisobi yo'q): ilova «ad-hoc» imzolanadi — Apple Silicon'da ochilishi uchun shu kerak.
# Kalit yo'q: diktovka kaliti ilovaning o'zida kiritiladi. Lokal rejim (RubaiSTT) Mac'da hozircha yo'q.
name: Gapla Mac DMG

on:
  push:
    branches: [main]
    paths:
      - "kompyuter/**"
      - ".github/workflows/gapla-mac-dmg.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gapla-mac-dmg
  cancel-in-progress: true

jobs:
  dmg:
    name: dmg (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Har protsessor o'z serverida: yuklab olinadigan yordamchi dasturlar (whisper.cpp, sherpa-onnx va boshqalar)
          # server protsessoriga qarab tanlanadi.
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      # Yuklash skriptlari GitHub relizlarini so'raydi — token so'rov chegarasini oshiradi (faqat o'qish).
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: kompyuter
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            kompyuter

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: kompyuter/.nvmrc
          cache: npm
          cache-dependency-path: kompyuter/package-lock.json

      - name: npm paketlari
        run: npm ci

      - name: Mac yordamchi dasturlari va yuklamalar
        run: npm run prebuild:mac

      - name: Oyna (vite)
        run: npm run build:renderer

      - name: Yig'ish (.dmg, ad-hoc imzo)
        # beforePack — eski brend tekshiruvi (scripts/gapla-iz-tekshir.js): eski iz qolsa yig'ish shu yerda to'xtaydi.
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Tekshiruv — imzo, protsessor, Info.plist
        run: |
          set -euo pipefail
          APP=$(find dist -maxdepth 2 -name "Gapla.app" -type d | head -1)
          echo "Ilova: $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Signature|Identifier|Format" || true
          lipo -archs "$APP/Contents/MacOS/Gapla"
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" -c "Print CFBundleShortVersionString" -c "Print LSMinimumSystemVersion" "$APP/Contents/Info.plist"
          ls -lh dist/*.dmg

      - name: .dmg ni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: gapla-mac-${{ matrix.arch }}
          path: kompyuter/dist/*.dmg
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      # Mac'siz jonli sinov (egasi 2026-11-14: «Ha, tekshir»): .dmg dan o'rnatiladi, ochiladi, 30 s dan keyin ham
      # ishlab turganini, Option+T (tarjimon) va Option+B (bufer) oynasini suratga oladi. Mikrofon yo'q — ovoz sinalmaydi.
      # Natija .dmg yig'ishini to'xtatmaydi; suratlar va jurnal «gapla-mac-sinov-…» faylida.
      - name: Sinov — .dmg dan o'rnatish va ochish
        id: sinov
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p sinov
          DMG=$(ls dist/*.dmg | head -1)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint /tmp/gapla-dmg
          ls /tmp/gapla-dmg | tee sinov/dmg-ichi.txt
          cp -R /tmp/gapla-dmg/Gapla.app /Applications/
          hdiutil detach /tmp/gapla-dmg
          spctl --assess --type execute -vv /Applications/Gapla.app > sinov/gatekeeper.txt 2>&1 || true
          /Applications/Gapla.app/Contents/MacOS/Gapla --log-level=debug > sinov/ilova-chiqishi.log 2>&1 &
          PID=$!
          sleep 35
          if kill -0 "$PID" 2>/dev/null; then
            echo "TIRIK: Gapla 35 soniyadan keyin ham ishlayapti" | tee sinov/natija.txt
          else
            echo "QULADI: Gapla 35 soniyaga yetmay yopildi" | tee sinov/natija.txt
            tail -80 sinov/ilova-chiqishi.log
            exit 1
          fi
          screencapture -x sinov/1-ochilish.png || echo "surat olinmadi" >> sinov/natija.txt
          oldinda() { echo "$1: oldindagi ilova — $(lsappinfo info -only name "$(lsappinfo front)" 2>/dev/null | tr -d '\n')" >> sinov/natija.txt; }
          oldinda "ochilgach"
          # Haqiqiy holat: egasi boshqa ilovada yozib turibdi (TextEdit), Option+T bosadi.
          printf 'Gapla sinovi\n' > /tmp/gapla-sinov.txt
          open -a TextEdit /tmp/gapla-sinov.txt
          sleep 5
          oldinda "TextEdit ochilgach"
          osascript -e 'tell application "System Events" to keystroke "t" using option down' >> sinov/natija.txt 2>&1 || echo "Option+T yuborilmadi" >> sinov/natija.txt
          sleep 4
          oldinda "Option+T dan keyin"
          screencapture -x sinov/2-option-t-tarjimon.png || true
          # Klaviatura tarjimon maydoniga tushadimi: matn yoziladi (kalit yo'q — tarjima o'rniga xato chiqishi kutiladi).
          osascript -e 'tell application "System Events" to keystroke "salom dunyo"' >/dev/null 2>&1 || true
          sleep 3
          screencapture -x sinov/2b-tarjimonga-yozildi.png || true
          osascript -e 'tell application "System Events" to key code 53' >/dev/null 2>&1 || true
          sleep 2
          oldinda "Esc dan keyin"
          # Tarjimon yopilgach klaviatura TextEdit'ga qaytadimi: shu so'z TextEdit hujjatida ko'rinishi kerak.
          osascript -e 'tell application "System Events" to keystroke " qaytdi"' >/dev/null 2>&1 || true
          sleep 2
          screencapture -x sinov/2c-esc-dan-keyin.png || true
          osascript -e 'tell application "System Events" to keystroke "b" using option down' >> sinov/natija.txt 2>&1 || echo "Option+B yuborilmadi" >> sinov/natija.txt
          sleep 4
          screencapture -x sinov/3-option-b-bufer.png || true
          osascript -e 'tell application "System Events" to key code 53' >/dev/null 2>&1 || true
          sleep 2
          screencapture -x sinov/3b-esc-dan-keyin.png || true
          if kill -0 "$PID" 2>/dev/null; then echo "TIRIK: tugmalardan keyin ham ishlayapti" | tee -a sinov/natija.txt; else echo "QULADI: tugmalardan keyin yopildi" | tee -a sinov/natija.txt; fi
          kill "$PID" 2>/dev/null || true
          sleep 2
          cp ~/Library/Application\ Support/Gapla/logs/*.log sinov/ 2>/dev/null || true
          grep -hiE "hotkey (not )?registered|Gapla (tarjima|bufer)|uncaught|fatal|crash" sinov/*.log | cut -c1-240 | sort -u | head -60 | tee sinov/muhim-qatorlar.txt || true

      - name: Sinov suratlari va jurnal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gapla-mac-sinov-${{ matrix.arch }}
          path: kompyuter/sinov/
          retention-days: 7
          if-no-files-found: ignore
